version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://reliefer_user:reliefer_password@db:5432/reliefer_db
      - JWT_SECRET_KEY=dev_secret_key_change_in_production_1234567890
      - ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reliefer_user
      POSTGRES_PASSWORD: reliefer_password
      POSTGRES_DB: reliefer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliefer_user -d reliefer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
