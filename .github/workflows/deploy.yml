name: Reliefer CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Railway Deployment Hook
        if: ${{ secrets.RAILWAY_DEPLOY_HOOK != null && secrets.RAILWAY_DEPLOY_HOOK != '' }}
        run: |
          curl -s -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK }}"

      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK != null && secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Deployment Status
        run: echo "Deployment workflow completed cleanly."
